name: Harness Checks

# ⚠ 이 워크플로는 **얇은 래퍼다.** 게이트 순서·차단 정책은 `scripts/ci.js` 가 소유하고
# 컨테이너가 그것을 돌린다([TOOL-27]). 여기 남은 것은 **CI 제공자에 고유한 배선**뿐이다:
# 체크아웃 · diff 범위 계산 · 증거 커밋 권한. 이 파일을 통째로 지워도 게이트는 산다 —
# `docker compose run --rm harness` 가 같은 판정을 낸다(어답터는 대개 그렇게 쓴다:
# private 레포에서 Actions 는 분당 과금이지만 컨테이너는 어디서든 무료다).
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # evidence append 커밋용([PRO-11] — Raw 평면은 시스템만 Append)
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # permission-guard 의 diff 범위가 이전 커밋을 보려면 전체 히스토리 필요

      - name: Gate chain (컨테이너가 정본 — scripts/ci.js)
        # 차단 정책은 ci.js 안에 있다([PRO-11]: exit 1 만 차단, 3·4 는 경고).
        # 여기서 계산하는 것은 **범위뿐**이다 — 새 브랜치 첫 push 에선 github.event.before 가
        # zero-SHA 라 diff 가 실패하고 가드가 "변경 없음"으로 조용히 통과한다 → 폴백이 필요하다.
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE=$(git rev-parse "${{ github.sha }}~1" 2>/dev/null || git hash-object -t tree /dev/null)
          fi
          docker compose run --rm harness --range "$BASE..${{ github.sha }}"

      - name: Append gate evidence to Raw plane (PRO-11 — "시스템만 Append"의 이행)
        # 게이트 전부 그린으로 여기 도달했을 때만 실행된다. [skip ci]로 자기 재트리거 방지.
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          SHORT=$(git rev-parse --short "${{ github.sha }}")
          echo "- [$(date -u +%F)][EVD-ci] gates green @ ${SHORT} (run ${{ github.run_id }}) — ci.js chain in container ([TOOL-27])" >> .union-stack/verification/raw/evidence.md
          git config user.name 'harness-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add .union-stack/verification/raw/evidence.md
          git commit -m 'chore(evidence): CI gate green append [skip ci]' || exit 0
          git push || echo "::warning::evidence push 실패(브랜치 보호/권한) — 다음 그린 런에서 재시도됨"
